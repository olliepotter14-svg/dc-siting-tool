# Clean URL for the EMEA market comparison tool. Served via a 200 rewrite
# (URL stays /markets). The page injects <base href="/DC Market Comparison/">
# when it detects it's under /markets, so its relative assets resolve to the
# real folder rather than the site root.
[[redirects]]
  from = "/markets"
  to = "/DC Market Comparison/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/markets/*"
  to = "/DC Market Comparison/:splat"
  status = 200
  force = true

[build.environment]
  GIT_LFS_ENABLED = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
