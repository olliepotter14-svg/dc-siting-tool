#   force = true
#
# [[redirects]]
#   from = "/index.html"
#   to = "/manchester.html"
#   status = 302
#   force = true

# Clean URL for the EMEA market comparison tool.
# Redirect the bare path to the trailing-slash form so the browser's base URL
# becomes /markets/ and the page's relative assets (markets.js, style.css,
# config.js, data/*) resolve via the /markets/* rewrite below — instead of
# breaking against the site root.
[[redirects]]
  from = "/markets"
  to = "/markets/"
  status = 301
  force = true

[[redirects]]
  from = "/markets/*"
  to = "/DC Market Comparison/:splat"
  status = 200
  force = true

[build.environment]
  GIT_LFS_ENABLED = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
