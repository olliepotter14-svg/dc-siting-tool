[build]
  publish = "."

# Redirect base URL to Manchester lead magnet
# Remove these lines when you want to open the full tool publicly
[[redirects]]
  from = "/"
  to = "/manchester.html"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/manchester.html"
  status = 302
  force = true

# Clean URL for the EMEA market comparison tool
[[redirects]]
  from = "/markets"
  to = "/DC Market Comparison/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/markets/*"
  to = "/DC Market Comparison/:splat"
  status = 200
  force = true

[build.environment]
  GIT_LFS_ENABLED = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
